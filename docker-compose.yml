services:
  db:
    image: ${DB_VERSION:-mariadb:11.8}
    env_file:
      - .env
    container_name: "pkp_db_${COMPOSE_PROJECT_NAME:-demo}"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-changeMePlease}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-pkp}"
      MYSQL_USER: "${MYSQL_USER:-pkp}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-changeMePlease}"
    volumes:
      - ./volumes/config/mariadb.cnf:/etc/mysql/conf.d/99-riara.cnf:ro
      - ./volumes/db:/var/lib/mysql
#      - ./volumes/config/db.charset.conf:/etc/mysql/conf.d/charset.cnf
#      - ./volumes/db-import:/docker-entrypoint-initdb.d
    networks:
      - inside
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ${IMAGE_SOURCE:-local}/${PKP_TOOL:-omp}:${PKP_VERSION:-3_3_0-20}
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        # Modify .env to change this arguments
        PKP_TOOL: ${PKP_TOOL:-omp}
        PKP_VERSION: ${PKP_VERSION}
        WEB_SERVER: ${WEB_SERVER}
        BUILD_PKP_APP_OS: ${BUILD_PKP_APP_OS}
    env_file:
      - .env
    container_name: "pkp_app_${COMPOSE_PROJECT_NAME:-demo}"
    hostname: "${COMPOSE_PROJECT_NAME:-demo}"
    environment:
      TZ: "${TZ:-Africa/Nairobi}"
    ports:
      - ${HTTP_PORT:-8081}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      # Use TZ env var instead of /etc/localtime (not portable on Windows hosts).
#      - /etc/localtime:/etc/localtime
      - ./volumes/private:/var/www/files
      - ./volumes/public:/var/www/html/public
      - ./volumes/logs/app:/var/log/apache2
#      # WARNING: You can only enable file-volumes if file exists in the container.
      - ./volumes/config/pkp.config.inc.php:/var/www/html/config.inc.php
#      - ./volumes/config/apache.htaccess:/var/www/html/.htaccess
      - ./volumes/config/php.custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./volumes/config/apache.performance.conf:/etc/apache2/conf-enabled/zzz-performance.conf:ro
      - ./volumes/plugins/themes/riarauniversity:/var/www/html/plugins/themes/riarauniversity
      - ./volumes/plugins/generic/riaraworkflownotifications:/var/www/html/plugins/generic/riaraworkflownotifications
      - ./volumes/plugins/generic/googleOAuth:/var/www/html/plugins/generic/googleOAuth

    networks:
      - inside
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/index.php/riara/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  inside:
    external: false
