name: OJS Riara CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Render OJS config from .env
        run: php volumes/scripts/render-config.php --force

      - name: Build and start stack
        run: |
          docker compose build app
          docker compose up -d --wait

      - name: Bootstrap database (import seed if needed)
        run: |
          docker cp volumes/scripts/test-config.php pkp_app_ojs-riara:/tmp/test-config.php
          docker cp volumes/db-import pkp_db_ojs-riara:/tmp/db-import
          docker cp volumes/scripts/ci-bootstrap.sh pkp_app_ojs-riara:/tmp/ci-bootstrap.sh
          docker exec pkp_app_ojs-riara sh /tmp/ci-bootstrap.sh pkp_app_ojs-riara pkp_db_ojs-riara

      - name: Wait for journal homepage
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8888/index.php/riara > /dev/null; then
              echo "Journal is up"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Install Playwright
        run: |
          npm ci || npm install
          npx playwright install chromium --with-deps

      - name: Run full test suite
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh --playwright

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
